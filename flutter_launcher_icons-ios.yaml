# إعداد أيقونة iOS منفصل تمامًا عن flutter_launcher_icons في
# pubspec.yaml عمدًا. لا تدمجه هناك: pubspec.yaml يُستخدم أيضًا من
# build-signed-apk.yml الذي لا يُنشئ مجلد ios/ إطلاقًا (فقط
# `flutter create --platforms=android`) — فلو كان ios: true في
# pubspec.yaml، ستحاول الأداة الكتابة في ios/Runner/... غير الموجود
# فينهار بناء أندرويد بالكامل (PathNotFoundException).
#
# هذا الملف يُستخدم فقط داخل .github/workflows/build-ios.yml، بعد أن
# يكون مجلد ios/ قد أُنشئ فعليًا عبر flutter create --platforms=ios:
#   dart run flutter_launcher_icons -f flutter_launcher_icons-ios.yaml
flutter_launcher_icons:
  android: false
  ios: true
  image_path: "assets/icon.png"
  remove_alpha_ios: true
